<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sign In - SpellPack</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <script>
    document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light');
  </script>
</head>
<body>
  <div class="auth-page">
    <header class="auth-page__header">
      <a href="index.html" class="auth-page__logo">
        <span class="auth-page__logo-icon">📦</span>
        SpellPack
      </a>
      <button id="theme-toggle" class="btn-icon theme-toggle" aria-label="Toggle dark mode" aria-pressed="false">
        <span class="theme-toggle__icon theme-toggle__icon--sun">☀️</span>
        <span class="theme-toggle__icon theme-toggle__icon--moon">🌙</span>
      </button>
    </header>

    <main class="auth-page__body">
      <div class="auth-card">
        <div class="auth-card__header">
          <h1>Welcome Back</h1>
          <p>Sign in to continue your spelling journey</p>
        </div>

        <form id="signin-form" novalidate>
          <div class="form-group">
            <label for="email">Email or Username</label>
            <input type="text" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Your password" required autocomplete="current-password">
          </div>
          <label class="form-checkbox mb-md">
            <input type="checkbox" name="remember" checked>
            Remember me
          </label>
          <button type="submit" class="btn btn-primary btn-block btn-lg">Sign In</button>
        </form>

        <div class="auth-card__footer">
          Don't have an account? <a href="signup.html">Sign Up</a>
        </div>
      </div>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>Auth.initSignIn();</script>
</body>
</html>
