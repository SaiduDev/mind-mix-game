<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Profile - MixMind</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <script>
    document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light');
  </script>
</head>
<body>
  <div class="app-shell profile-page">
    <header class="app-header">
      <div class="app-header__brand">
        <span class="app-header__brand-icon">📦</span>
        MixMind
      </div>
      <div class="app-header__actions">
        <button id="theme-toggle" class="btn-icon theme-toggle" aria-label="Toggle dark mode">
          <span class="theme-toggle__icon theme-toggle__icon--sun">☀️</span>
          <span class="theme-toggle__icon theme-toggle__icon--moon">🌙</span>
        </button>
      </div>
    </header>

    <main class="app-main">
      <div id="profile-loading" class="loading-screen">
        <div class="spinner"></div>
        <p class="text-muted">Loading profile...</p>
      </div>

      <div id="profile-error" class="form-error" hidden></div>

      <div id="profile-content" hidden>
        <div class="profile-card">
          <div class="profile-avatar" id="profile-avatar">?</div>
          <h2 class="profile-name" id="profile-name">—</h2>
          <p class="profile-username" id="profile-username">—</p>

          <div class="profile-details">
            <div class="profile-detail">
              <span class="profile-detail__icon">📧</span>
              <div class="profile-detail__content">
                <div class="profile-detail__label">Email</div>
                <div class="profile-detail__value" id="profile-email">—</div>
              </div>
            </div>
            <div class="profile-detail">
              <span class="profile-detail__icon">🎯</span>
              <div class="profile-detail__content">
                <div class="profile-detail__label">Current Level</div>
                <div class="profile-detail__value" id="profile-level">—</div>
              </div>
            </div>
            <div class="profile-detail">
              <span class="profile-detail__icon">⭐</span>
              <div class="profile-detail__content">
                <div class="profile-detail__label">Total Score</div>
                <div class="profile-detail__value" id="profile-score">—</div>
              </div>
            </div>
            <div class="profile-detail">
              <span class="profile-detail__icon">✅</span>
              <div class="profile-detail__content">
                <div class="profile-detail__label">Levels Completed</div>
                <div class="profile-detail__value" id="profile-completed">—</div>
              </div>
            </div>
          </div>

          <button id="logout-btn" class="btn btn-danger btn-block btn-lg">Logout</button>
        </div>
      </div>
    </main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <a href="dashboard.html" class="bottom-nav__item" data-page="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Home
      </a>
      <a href="game.html" class="bottom-nav__item" data-page="game">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><line x1="6" y1="12" x2="10" y2="12"/><line x1="8" y1="10" x2="8" y2="14"/></svg>
        Play
      </a>
      <a href="profile.html" class="bottom-nav__item active" data-page="profile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Profile
      </a>
    </nav>
  </div>

  <script src="js/api.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
